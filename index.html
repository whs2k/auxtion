<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auxtion | Luxury Auction Sales Tracker</title>
    <meta name="description" content="Track recent high-value auction sales from Christie's, Sotheby's, Phillips, eBay, and StockX.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow"></div>

    <header>
        <div class="logo" id="home-link">AUXCTION</div>
        <nav class="nav-links">
            <a href="#about">About</a>
            <a href="https://github.com/whs2k/auxtion" target="_blank">GitHub</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Curating Global Luxury Sales</h1>
        <p>Real-time insights into the world's most exclusive auctions. From fine art to rare sneakers, track what's actually selling.</p>
    </section>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search by name, house, or category...">
        </div>
        <select id="house-filter" class="filter-select">
            <option value="all">All Houses</option>
            <option value="Christie's">Christie's</option>
            <option value="Sotheby's">Sotheby's</option>
            <option value="Phillips">Phillips</option>
            <option value="eBay">eBay</option>
            <option value="StockX">StockX</option>
        </select>
        <select id="sort-order" class="filter-select">
            <option value="date-desc">Newest First</option>
            <option value="price-desc">Highest Price</option>
            <option value="price-asc">Lowest Price</option>
        </select>
    </div>

    <main class="sales-grid" id="sales-container">
        <!-- Sales will be injected here -->
        <div class="loading">Discovering latest sales...</div>
    </main>

    <footer>
        <p>&copy; 2024 AUXCTION. Data refreshed daily from global auction houses.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
